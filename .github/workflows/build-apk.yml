name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
            APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            cp "$APK_SRC" ../Candy-Crush-Deluxe-release.apk
            echo "APK_FILE=Candy-Crush-Deluxe-release.apk" >> $GITHUB_ENV
          else
            ./gradlew assembleDebug --no-daemon
            APK_SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
            cp "$APK_SRC" ../Candy-Crush-Deluxe-debug.apk
            echo "APK_FILE=Candy-Crush-Deluxe-debug.apk" >> $GITHUB_ENV
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Candy-Crush-Deluxe-APK
          path: ${{ env.APK_FILE }}
          retention-days: 30

      - name: Action Summary
        run: |
          echo "### 🍬 Candy Crush Deluxe APK Build Complete! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "The Android APK has been successfully built and uploaded as a GitHub Actions Artifact." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Name:** \`Candy-Crush-Deluxe-APK\`" >> $GITHUB_STEP_SUMMARY
          echo "- **File:** \`${{ env.APK_FILE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "You can download the APK from the **Artifacts** section at the bottom of this Actions workflow run!" >> $GITHUB_STEP_SUMMARY
