name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses & Setup SDK
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8568e64757e75e9262f3a69a19c5c2a3e5c9429c\n84831b9409646a918e30573bab4c9c91346d8abd\n35ac021336d4ebcdac7e7f8998dd573d34f1ff7b" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" 2>/dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Sync Capacitor Android
        run: |
          test -d android || npx cap add android
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          cd android
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease -x lint -x test --no-daemon --stacktrace
            APK_SRC=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
            if [ -z "$APK_SRC" ]; then
              APK_SRC=$(find . -name "*.apk" | head -n 1)
            fi
            cp "$APK_SRC" ../Candy-Crush-Deluxe-release.apk
            echo "APK_FILE=Candy-Crush-Deluxe-release.apk" >> $GITHUB_ENV
          else
            ./gradlew assembleDebug -x lint -x test --no-daemon --stacktrace
            APK_SRC=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
            if [ -z "$APK_SRC" ]; then
              APK_SRC=$(find . -name "*.apk" | head -n 1)
            fi
            cp "$APK_SRC" ../Candy-Crush-Deluxe-debug.apk
            echo "APK_FILE=Candy-Crush-Deluxe-debug.apk" >> $GITHUB_ENV
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Candy-Crush-Deluxe-APK
          path: ${{ env.APK_FILE }}
          retention-days: 30

      - name: Action Summary
        run: |
          echo "### 🍬 Candy Crush Deluxe APK Build Complete! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "The Android APK has been successfully built and uploaded as a GitHub Actions Artifact." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Name:** \`Candy-Crush-Deluxe-APK\`" >> $GITHUB_STEP_SUMMARY
          echo "- **File:** \`${{ env.APK_FILE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "You can download the APK from the **Artifacts** section at the bottom of this Actions workflow run!" >> $GITHUB_STEP_SUMMARY
